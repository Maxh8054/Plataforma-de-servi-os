<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Painel TV ZAMine · Goiás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: palco fixo 1920x1080 escalado para a TV — cabeçalho, área do slide, rodapé com dias sem acidentes; editor sobreposto */
:root{
  --bg:#0d0c0b; --panel:#181614; --panel2:#211e1b; --line:#2e2a26;
  --fg:#f5f2ee; --muted:#9b948b; --accent:#ff6600; --accent-soft:#ff660026;
  --ok:#3fbf6f; --warn:#f2c230; --bad:#e5484d; --wait:#a58bf5; --idle:#7d8a99;
  --link:#4a443d; --on-accent:#120800; --bar2:#7a3a12; --hz2:#111;
  --la:#ff8a3d; --lb:#5cc8ff; --lc:#7ee08a; --ld:#f2c230;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
*{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}

/* temas das telas (só o palco da TV; o editor fica sempre escuro) */
.th-light{--bg:#f6f4f1;--panel:#ffffff;--panel2:#ebe6e0;--line:#dcd4cb;--fg:#17130f;--muted:#6a625a;--accent:#f26100;--accent-soft:#ff66001f;
  --ok:#1e9a52;--warn:#c48f00;--bad:#d4363c;--wait:#7457dd;--idle:#66727f;--link:#c4b9ad;--on-accent:#17130f;--bar2:#ffc9a3;--hz2:#17130f;
  --la:#e05800;--lb:#0b7fbf;--lc:#25913e;--ld:#a87d00;color-scheme:light}
#stage.th-orange{--bg:#ff6600;--panel:#ff7c26;--panel2:#ff9147;--line:#ffa065;--fg:#170a01;--muted:#5a2a07;--accent:#170a01;--accent-soft:#170a0122;
  --link:#a83f00;--on-accent:#ff7c26;--bar2:#b84800;--hz2:#ffffff;--la:#170a01;--lb:#170a01;--lc:#170a01;--ld:#170a01}
#stage{transition:background-color .5s ease;color:var(--fg)}
#stage .hd,#stage .ft{transition:background-color .5s ease}
.logo-l{display:none!important}
#stage.th-light .logo-d{display:none!important}
#stage.th-light .logo-l{display:block!important}
#stage.th-orange .ft .dsa{background:#170a01;color:#ff7c26}
@media (prefers-reduced-motion:reduce){#stage{transition:none}}

/* palco */
#viewport{position:fixed;inset:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);display:grid;grid-template-rows:128px 1fr 96px;overflow:hidden}
.hd{display:grid;grid-template-columns:420px 1fr 420px;align-items:center;padding:0 56px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px}
.brand{gap:22px}
.brand .logo{height:88px;width:auto;display:block}
.brand small{display:block;font-size:16px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;line-height:1.35;border-left:1px solid var(--line);padding-left:20px}
.hd-title{text-align:center}
.hd-title .eyb{font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hd-title h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:52px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.clock{text-align:right}
.clock b{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:1}
.clock span{display:block;font-size:20px;color:var(--muted);text-transform:capitalize}
.sample{position:absolute;top:136px;right:56px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:15px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:4px}

#main{position:relative;padding:44px 56px 40px;overflow:hidden}
.slide{position:absolute;inset:44px 56px 40px;animation:in .6s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.bar i{animation:none!important}}

.ft{display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;border-top:1px solid var(--line);position:relative}
.ft .dsa{background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:16px;padding:0 40px 0 56px}
.ft .dsa b{font-family:var(--f-display);font-size:60px;font-weight:800;line-height:1}
.ft .dsa span{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;line-height:1.1}
.ft .msg{display:flex;align-items:center;padding:0 40px;font-size:26px;color:var(--fg);overflow:hidden;white-space:nowrap}
.ft .msg span{overflow:hidden;text-overflow:ellipsis}
.ft .pos{display:flex;align-items:center;gap:10px;padding:0 56px 0 24px}
.ft .pos i{width:34px;height:6px;background:var(--line);border-radius:3px}
.ft .pos i.on{background:var(--accent)}
.ft .pos em{font-style:normal;font-size:20px;color:var(--muted);margin-left:10px}
.bar{position:absolute;left:0;right:0;top:-1px;height:3px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
@keyframes grow{from{width:0}to{width:100%}}

/* elementos comuns dos slides */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.lbl{font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:34px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:56px;text-transform:uppercase;margin-bottom:10px}

/* Dias sem acidentes */
.s-dsa{display:grid;grid-template-columns:28px 1.25fr 1fr;gap:64px;height:100%}
.hazard{background:repeating-linear-gradient(-45deg,var(--accent) 0 26px,var(--hz2) 26px 52px);border-radius:4px}
.s-dsa .big{display:flex;flex-direction:column;justify-content:center}
.s-dsa .big b{font-family:var(--f-display);font-weight:800;font-size:460px;line-height:.82;color:var(--accent);letter-spacing:-.01em}
.s-dsa .big span{font-family:var(--f-display);font-size:78px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:18px}
.s-dsa .side{display:flex;flex-direction:column;justify-content:center;gap:28px}
.kv{padding:26px 32px}
.kv b{display:block;font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1.05;margin-top:6px}
.meter{height:18px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:16px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.s-dsa .quote{font-size:34px;line-height:1.35;border-left:6px solid var(--accent);padding-left:24px}

/* Status de máquinas */
.s-maq{display:grid;grid-template-rows:auto 1fr;gap:28px;height:100%}
.sum{display:flex;gap:20px}
.sum .card{padding:16px 24px;display:flex;align-items:center;gap:16px;flex:1}
.sum .card b{font-family:var(--f-display);font-size:58px;line-height:1}
.sum .card.disp{flex:1.4;border-color:var(--accent)}
.sum .card.disp b{color:var(--accent)}
.grid-m{display:grid;gap:20px;align-content:start}
.mq{padding:22px 26px;display:grid;grid-template-rows:auto auto 1fr;gap:6px;border-top:8px solid var(--c,var(--idle));min-width:0}
.mq .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mq .tag{font-family:var(--f-display);font-size:60px;font-weight:800;line-height:1}
.mq .mod{font-size:22px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.pill::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--c)}
.mq .obs{font-size:24px;line-height:1.3;color:var(--fg);opacity:.9}

/* tabelas */
table.t{width:100%;border-collapse:collapse;font-size:28px}
.t th{text-align:left;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 20px 14px;border-bottom:2px solid var(--line)}
.t td{padding:18px 20px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.today td{background:var(--accent-soft)}
.t tr.today td:first-child{box-shadow:inset 6px 0 0 var(--accent)}
.t .d{font-family:var(--f-display);font-weight:700;font-size:34px;white-space:nowrap}
.t .d small{display:block;font-family:var(--f-body);font-size:18px;color:var(--muted);font-weight:500;text-transform:capitalize}
.more{margin-top:14px;font-size:20px;color:var(--muted)}

/* Escala */
.s-esc{display:grid;grid-template-rows:auto auto;gap:36px}
.esc{display:grid;grid-template-columns:220px repeat(var(--n),1fr);gap:10px}
.esc .h{padding:14px 10px;text-align:center;border-radius:8px}
.esc .h b{display:block;font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1}
.esc .h span{font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.esc .h.today{background:var(--accent);color:var(--on-accent)}
.esc .h.today span{color:var(--on-accent)}
.esc .rl{display:flex;flex-direction:column;justify-content:center;padding:0 18px}
.esc .rl b{font-family:var(--f-display);font-size:38px;text-transform:uppercase}
.esc .rl span{font-size:20px;color:var(--muted)}
.lt{height:150px;display:grid;place-items:center;border-radius:10px;font-family:var(--f-display);font-size:96px;font-weight:800;background:var(--panel);border:1px solid var(--line)}
.lt.today{outline:4px solid var(--accent);outline-offset:-4px}
.L-A{color:var(--la)}.L-B{color:var(--lb)}.L-C{color:var(--lc)}.L-D{color:var(--ld)}
.turmas{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.turma{padding:20px 24px;display:flex;align-items:center;gap:20px;min-width:0}
.turma .lt2{font-family:var(--f-display);font-size:72px;font-weight:800;line-height:1;width:60px}
.turma div{min-width:0}
.turma b{display:block;font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turma span{font-size:20px;color:var(--muted)}

/* Escala automática (puxada da plataforma) */
.esc-auto{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.esc-day{padding:30px 34px;display:flex;flex-direction:column;gap:10px;border-top:8px solid var(--line);min-width:0}
.esc-day.hj{border-top-color:var(--accent)}
.esc-dh{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
.esc-dh b{font-family:var(--f-display);font-size:40px;text-transform:uppercase;letter-spacing:.05em}
.esc-day.hj .esc-dh b{color:var(--accent)}
.esc-dh span{font-size:24px;color:var(--muted);text-transform:capitalize}
.esc-row{display:flex;align-items:center;gap:24px;padding:12px 0;border-top:1px solid var(--line)}
.esc-row .lt3{font-family:var(--f-display);font-size:88px;font-weight:800;line-height:1;width:88px;text-align:center;flex:none}
.esc-p{min-width:0}
.esc-p b{display:block;font-size:42px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.esc-p .t{font-size:23px;color:var(--muted)}
.esc-selo{display:inline-flex;margin-top:6px;padding:3px 14px;border:1px solid var(--accent);border-radius:999px;font-size:19px;color:var(--accent)}
.esc-off{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);font-size:21px;color:var(--muted)}
.esc-off em{font-style:normal;opacity:.85}
.esc-next{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.esc-nx{padding:12px 10px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.esc-nx .lbl{font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.esc-nx .num2{font-family:var(--f-display);font-size:30px;font-weight:700;margin-top:2px}
.esc-nx .duo{display:flex;justify-content:center;gap:14px;font-family:var(--f-display);font-size:44px;font-weight:800;margin-top:8px;line-height:1}

/* Perdas */
.s-per{display:grid;grid-template-columns:1fr 440px;gap:56px;height:100%}
.bars{display:flex;flex-direction:column;justify-content:center;gap:20px}
.br{display:grid;grid-template-columns:380px 1fr 220px;align-items:center;gap:24px}
.br .n{font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tr{height:52px;background:var(--panel);border-radius:6px;overflow:hidden}
.br .tr i{display:block;height:100%;background:var(--bar2);border-radius:6px}
.br:first-child .tr i{background:var(--accent)}
.br .v{font-family:var(--f-display);font-size:40px;font-weight:700;text-align:right}
.br .v small{font-family:var(--f-body);font-size:20px;color:var(--muted);font-weight:500;margin-left:8px}
.per-side{display:flex;flex-direction:column;justify-content:center;gap:24px}

/* Campanhas de segurança */
.s-cs{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;height:100%}
.feat{padding:56px 60px;display:flex;flex-direction:column;justify-content:center;gap:26px;position:relative;overflow:hidden;border-color:var(--accent)}
.feat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 22px,var(--hz2) 22px 44px)}
.feat h2{margin:0;font-family:var(--f-display);font-size:104px;line-height:.95;text-transform:uppercase;font-weight:800;text-wrap:balance}
.feat p{margin:0;font-size:38px;line-height:1.35;max-width:30ch}
.feat .per{font-size:24px;color:var(--accent);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.others{display:flex;flex-direction:column;gap:20px}
.oc{padding:26px 30px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:0}
.oc b{font-family:var(--f-display);font-size:42px;text-transform:uppercase;line-height:1}
.oc p{margin:0;font-size:24px;line-height:1.35;color:var(--fg);opacity:.9}

/* Engage */
.s-eng{display:grid;gap:28px;height:100%}
.eg{padding:36px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eg .per{font-size:20px;color:var(--accent);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.eg h3{margin:0;font-family:var(--f-display);font-size:58px;line-height:1;text-transform:uppercase;font-weight:800;text-wrap:balance}
.eg p{margin:0;font-size:28px;line-height:1.4;flex:1}
.eg .pr{display:flex;justify-content:space-between;align-items:baseline}
.eg .pr b{font-family:var(--f-display);font-size:56px;color:var(--accent)}

/* Aniversários */
.s-ani{display:grid;grid-template-rows:auto 1fr;gap:28px;height:100%}
.ani-h{display:flex;align-items:baseline;gap:20px}
.ani-h b{font-family:var(--f-display);font-size:72px;text-transform:uppercase;line-height:1;color:var(--accent)}
.ani-h span{font-size:28px;color:var(--muted)}
.grid-a{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-content:start}
.an{padding:20px 24px;display:flex;align-items:center;gap:22px;min-width:0}
.an .dd{font-family:var(--f-display);font-size:76px;font-weight:800;line-height:.9;width:96px;text-align:center;color:var(--muted)}
.an div{min-width:0}
.an b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:28px;line-height:1.15;overflow:hidden}
.an span{font-size:21px;color:var(--muted)}
.an.today{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.an.today .dd,.an.today span{color:var(--on-accent)}
.an.past{opacity:.55}

/* imagens nos slides */
.ft-img img,.oc-img img,.eg-img img,.mos img,.ev-th img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.feat.has-img{display:grid;grid-template-columns:1fr 1fr;padding:0;gap:0}
.feat.has-img .ft-txt{padding:56px 52px 70px;display:flex;flex-direction:column;justify-content:center;gap:24px;min-width:0}
.feat.has-img h2{font-size:84px}
.feat.has-img p{font-size:32px}
.feat .ft-txt{display:contents}
.feat.has-img .ft-txt{display:flex}
.ft-img{min-height:0;background:var(--panel2)}
.oc.has-img{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;padding:18px}
.oc-img{width:150px;height:150px;border-radius:8px;overflow:hidden;background:var(--panel2)}
.oc-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.eg-img{aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--panel2);margin:-12px -16px 4px;max-width:calc(100% + 32px)}
.s-ev{display:grid;grid-template-columns:1.35fr 1fr;gap:32px;height:100%}
.mos{display:grid;gap:14px;min-height:0}
.mos>div{border-radius:10px;overflow:hidden;background:var(--panel2);min-height:0}
.mos.m2{grid-template-rows:1.4fr 1fr}
.mos.m3{grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr}
.mos.m3>div:first-child{grid-row:1/3}
.ev-side{display:flex;flex-direction:column;gap:24px;min-height:0}
.ev-main{display:flex;flex-direction:column;gap:16px}
.ev-main .per{font-size:24px;color:var(--accent);font-weight:600;letter-spacing:.1em}
.ev-main h2{margin:0;font-family:var(--f-display);font-size:72px;line-height:.98;text-transform:uppercase;font-weight:800;text-wrap:balance}
.ev-main p{margin:0;font-size:28px;line-height:1.4}
.ev-list{margin-top:auto;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px}
.ev-it{display:flex;align-items:center;gap:18px;min-width:0}
.ev-th{width:120px;height:76px;border-radius:6px;overflow:hidden;flex:none;background:var(--panel2)}
.ev-th.none{background:repeating-linear-gradient(-45deg,var(--panel2) 0 10px,var(--panel) 10px 20px)}
.ev-it div:last-child{min-width:0}
.ev-it b{display:block;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-it span{font-size:19px;color:var(--muted)}
.an .av{width:84px;height:84px;border-radius:50%;overflow:hidden;flex:none;background:var(--panel2);display:grid;place-items:center;border:3px solid var(--line)}
.an .av span{font-family:var(--f-display);font-size:36px;font-weight:700;color:var(--muted)}
.an.today .av{border-color:var(--on-accent);background:#ffffff33}
.an.today .av span{color:var(--on-accent)}
.an .nm{min-width:0}
.an .dd{font-size:60px;width:70px}

/* Valores */
.s-val{display:grid;grid-template-columns:1fr 1.5fr;gap:64px;height:100%}
.mv{display:flex;flex-direction:column;justify-content:center;gap:44px;padding-right:56px;border-right:1px solid var(--line)}
.mv p{margin:12px 0 0;font-size:36px;line-height:1.35;text-wrap:pretty}
.vl{display:flex;flex-direction:column;justify-content:center}
.vr{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.vl.ac .vr{grid-template-columns:96px minmax(0,5fr) minmax(0,7fr);gap:32px}
.vr .lt3{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:.85;color:var(--accent);text-align:center}
.vl.ac .vr b::first-letter{color:inherit}
.vl.ac.sm b{font-size:42px}.vl.ac.sm p{font-size:22px}.vl.ac.sm .vr{padding:13px 0}
.vr:last-child{border-bottom:0}
.vr b{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.95;color:var(--fg)}
.vr b::first-letter{color:var(--accent)}
.vr p{margin:0;color:var(--muted);line-height:1.35}
.vl.lg b{font-size:72px}.vl.lg p{font-size:30px}.vl.lg .vr{padding:34px 0}
.vl.md b{font-size:58px}.vl.md p{font-size:26px}
.vl.sm b{font-size:48px}.vl.sm p{font-size:23px}.vl.sm .vr{padding:16px 0}

/* abas administrativas: exclusivas de admins, nunca entram na rotação da TV */
const ADMIN_TOOLS = new Set(["config","aprovacoes","permissoes"]);
const SLIDE_KEYS = SECTIONS.filter(s=>!ADMIN_TOOLS.has(s.key)).map(s=>s.key);
const cfgPart = k => SECTIONS.find(s=>s.key==="config").parts.find(p=>p.key===k);
cfgPart("ativos").fields = SLIDE_KEYS.map(k=>({k,l:SECTIONS.find(s=>s.key===k).label,t:"check"}));
cfgPart("duracoes").fields = SLIDE_KEYS.map(k=>({k,l:SECTIONS.find(s=>s.key===k).label,t:"number",ph:"padrão"}));

/* telas cheias de cores de status ficam fora do sorteio do laranja */
const NO_ORANGE = new Set(["maquinas","escala","perdas","programacao","organograma"]);
const THEME_CLS = {Preto:"th-dark",Branco:"th-light"};
let lastTheme = "th-dark";
function pickTheme(key){
  const fixed = get(data,"config","cores")?.[key];
  if(fixed && THEME_CLS[fixed]) return THEME_CLS[fixed];
  const pool = ["th-dark","th-light"];
  const opts = pool.filter(t=>t!==lastTheme);
  return opts[Math.floor(Math.random()*opts.length)] || "th-dark";
}
function applyTheme(t){
  const st = document.getElementById("stage");
  st.classList.remove("th-dark","th-light","th-orange"); st.classList.add(t); lastTheme = t;
}
SECTIONS.find(s=>s.key==="config").parts[2].fields = SLIDE_KEYS.map(k=>({k,l:SECTIONS.find(s=>s.key===k).label,t:"number",ph:"padrão"}));

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pDate = s => { if(!s) return null; const [y,m,d]=String(s).split("-").map(Number); return y?new Date(y,m-1,d):null; };
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const nextDate = () => iso(today0());
const fmtDM = d => d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const fmtDMY = d => d.toLocaleDateString("pt-BR");
const wk = d => d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
const num = v => { const n=Number(v); return isFinite(n)?n:0; };
const fmtH = n => (Math.round(n*10)/10).toLocaleString("pt-BR");
const get = (o,sec,part) => (o && o[sec] && o[sec][part]) || null;
const list = (o,sec,part="itens") => Array.isArray(get(o,sec,part)) ? get(o,sec,part) : [];
function diasSemAcidente(o){
  const d = pDate(get(o,"seguranca","dados")?.ultimoAcidente);
  if(!d) return null;
  return Math.max(0, Math.round((today0()-d)/864e5));
}
const img = v => v ? `<img src="${esc(v)}" alt="" loading="eager" onerror="this.style.visibility='hidden'">` : "";
/* campanha no ar hoje? sem datas = sempre */
function noAr(c){ const t=+today0(), i=pDate(c.inicio), f=pDate(c.fim); return (!i || +i<=t) && (!f || +f>=t); }
function faltaTxt(d){ const n=Math.round((d-today0())/864e5); return n<=0?"Hoje":n===1?"Amanhã":`Faltam ${n} dias`; }
const emptyBox = (t,m) => `<div class="empty"><div><b>${esc(t)}</b>${esc(m)}</div></div>`;

/* ---------- escala automática (puxada da plataforma) ---------- */
const TV_TZ = (()=>{ try{ return encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone||"America/Sao_Paulo"); }catch(e){ return encodeURIComponent("America/Sao_Paulo"); } })();
let escalaAuto = null;   // calculada no servidor e entregue junto com o /content
const HORA_DIURNA = "07:00 – 19:00", HORA_NOTURNA = "19:00 – 07:00";
const LCLS = {A:"L-A",B:"L-B",C:"L-C",D:"L-D"};
function escPessoa(x, linha){
  return `<div class="esc-row"><span class="lt3 ${LCLS[x.letra]||""}">${esc(x.letra)}</span>
    <div class="esc-p"><b>${esc(x.nome)}</b><span class="t">${esc(linha)}</span>
    ${x.selo?`<span class="esc-selo">🔄 ${esc(x.selo)}</span>`:""}</div></div>`;
}
function escDiaAuto(d, hd, hn){
  const dt = pDate(d.data);
  const off = d.fora.map(f=>`${esc(f.letra)} — ${esc(f.nome)} <em>(${esc(f.motivo||"Folga")})</em>`).join(" · ");
  const row = (arr, hora, vazio)=>arr.length?arr.map(x=>escPessoa(x,hora)).join("")
    :`<div class="esc-row"><span class="lt3">–</span><div class="esc-p"><b>${vazio}</b><span class="t">${esc(hora)}</span></div></div>`;
  return `<div class="card esc-day ${d.destaque==="hoje"?"hj":""}">
    <div class="esc-dh"><b>${d.destaque==="hoje"?"Hoje":"Amanhã"}</b><span>${esc(d.diaSemana)}${dt?" · "+fmtDM(dt):""}</span></div>
    ${row(d.diurno,"🌅 Diurno · "+hd,"Sem diurno escalado")}
    ${row(d.noturno,"🌙 Noturno · "+hn,"Sem noturno escalado")}
    ${off?`<div class="esc-off">Fora: ${off}</div>`:""}
  </div>`;
}
function renderEscalaAuto(o){
  if(!escalaAuto || !Array.isArray(escalaAuto.dias) || !escalaAuto.dias.length)
    return emptyBox("Escala automática carregando","A TV está buscando a escala da plataforma. Se persistir, verifique a conexão.");
  const h = get(o,"escala","horarios") || {};
  const hd = String(h.diurno||"").trim() || HORA_DIURNA;
  const hn = String(h.noturno||"").trim() || HORA_NOTURNA;
  const hj = escalaAuto.dias.find(d=>d.destaque==="hoje");
  const am = escalaAuto.dias.find(d=>d.destaque==="amanha");
  const nx = escalaAuto.dias.filter(d=>!d.destaque);
  const prox = nx.length?`<div class="esc-next">${nx.map(d=>{const dt=pDate(d.data);
    const ld=d.diurno.map(x=>`<span class="${LCLS[x.letra]||""}">${esc(x.letra)}</span>`).join("")||"<span>–</span>";
    const ln=d.noturno.map(x=>`<span class="${LCLS[x.letra]||""}">${esc(x.letra)}</span>`).join("")||"<span>–</span>";
    return `<div class="esc-nx"><div class="lbl">${dt?wk(dt):""}</div><div class="num2">${dt?fmtDM(dt):""}</div>
      <div class="duo"><span style="font-size:26px">🌅</span>${ld}<span style="font-size:26px">🌙</span>${ln}</div></div>`;}).join("")}</div>`:"";
  const tur = list(o,"escala","turmas");
  /* sem turmas cadastradas, mostra as 4 equipes com os nomes da plataforma */
  const hjDia = escalaAuto.dias.find(d=>d.destaque==="hoje");
  const equipes = hjDia ? [...hjDia.diurno,...hjDia.noturno,...hjDia.fora]
    .sort((a,b)=>a.letra.localeCompare(b.letra))
    .map(p=>({letra:p.letra,lider:p.nome,obs:p.selo||p.motivo||("Equipe "+p.letra)})) : [];
  const turmas = tur.length ? tur.slice(0,4)
    : equipes.slice(0,4).map(x=>`<div class="card turma"><span class="lt2 ${LCLS[x.letra]||"L-"+esc(x.letra)}">${esc(x.letra)}</span><div><b>${esc(x.lider)}</b><span>${esc(x.obs)}</span></div></div>`).join("");
  return `<div class="s-esc">
    <div class="esc-auto">${escDiaAuto(hj,hd,hn)}${escDiaAuto(am,hd,hn)}</div>
    ${prox}
    ${turmas?`<div class="turmas">${turmas}</div>`:""}
  </div>`;
}

/* ---------- renderização dos slides ---------- */
const R = {
  seguranca(o){
    const s = get(o,"seguranca","dados") || {};
    const dias = diasSemAcidente(o);
    if(dias===null) return emptyBox("Sem data cadastrada","Informe a data do último acidente no editor.");
    const rec = Math.max(num(s.recorde), dias), meta = num(s.meta);
    const pct = meta>0 ? Math.min(100, dias/meta*100) : 0;
    return `<div class="s-dsa">
      <div class="hazard"></div>
      <div class="big"><b class="num">${dias}</b><span>dias sem acidentes com afastamento</span></div>
      <div class="side">
        <div class="card kv"><div class="lbl">Último registro</div><b class="num">${fmtDMY(pDate(s.ultimoAcidente))}</b></div>
        <div class="card kv"><div class="lbl">Recorde da operação</div><b class="num">${rec} dias${rec===dias&&dias>0?' <span style="font-size:30px;color:var(--accent)">· novo recorde</span>':''}</b></div>
        ${meta>0?`<div class="card kv"><div class="lbl">Meta: ${meta} dias · faltam ${Math.max(0,meta-dias)}</div><div class="meter"><i style="width:${pct}%"></i></div></div>`:""}
        ${s.mensagem?`<div class="quote clamp3">${esc(s.mensagem)}</div>`:""}
      </div></div>`;
  },
  maquinas(o){
    const it = list(o,"maquinas");
    if(!it.length) return emptyBox("Nenhum equipamento","Cadastre os equipamentos no editor.");
    const op = it.filter(m=>m.status==="Operando").length;
    const cnt = k => it.filter(m=>m.status===k).length;
    const cols = it.length<=3?it.length:it.length<=8?4:5;
    const sum = ["Preventiva","Corretiva","Aguardando peça"].map(k=>`<div class="card"><b class="num" style="color:${STATUS[k].c}">${cnt(k)}</b><div class="lbl">${k}</div></div>`).join("");
    return `<div class="s-maq">
      <div class="sum"><div class="card disp"><b class="num">${Math.round(op/it.length*100)}%</b><div class="lbl">Disponibilidade física<br>${op} de ${it.length} operando</div></div>${sum}</div>
      <div class="grid-m" style="grid-template-columns:repeat(${cols},1fr)">${it.slice(0,15).map(m=>{
        const c = (STATUS[m.status]||STATUS.Standby).c;
        return `<div class="card mq" style="--c:${c}"><div class="top"><span class="tag">${esc(m.tag)}</span><span class="mod">${esc(m.modelo)}</span></div>
          <span class="pill">${esc(m.status||"Standby")}</span><div class="obs clamp2">${esc(m.obs)}</div></div>`;}).join("")}</div></div>`;
  },
  programacao(o){
    const t = today0();
    const it = list(o,"programacao").filter(a=>{const d=pDate(a.data);return !d||d>=t;})
      .sort((a,b)=>(a.data||"9").localeCompare(b.data||"9")||(a.hora||"").localeCompare(b.hora||""));
    if(!it.length) return emptyBox("Sem atividades programadas","Adicione a programação da semana no editor.");
    const nx = it.find(a=>{const d=pDate(a.data);return d&&+d>+t;});
    let hero = "";
    if(nx){ const d=pDate(nx.data), n=Math.round((d-t)/864e5);
      hero = `<div class="card nx"><div class="nx-n"><b class="num">${n}</b><span>${n===1?"dia":"dias"}</span></div>
        <div class="nx-t"><div class="lbl" style="color:var(--accent)">Próxima atividade · ${n===1?"amanhã":"faltam "+n+" dias"}</div><h3>${esc(nx.atividade)}</h3>
        <span class="num">${esc([nx.equipamento&&nx.equipamento!=="—"?nx.equipamento:"", fmtDMY(d)+(nx.hora?" às "+nx.hora:""), nx.responsavel].filter(Boolean).join("  ·  "))}</span></div></div>`; }
    const max = hero?5:8, rows = it.slice(0,max).map(a=>{const d=pDate(a.data); const isT=d&&+d===+t;
      return `<tr class="${isT?"today":""}"><td class="d num">${d?fmtDM(d):"—"}<small>${d?(isT?"hoje":wk(d)):""}</small></td>
      <td class="num" style="white-space:nowrap">${esc(a.hora)||"—"}</td><td><b>${esc(a.atividade)}</b></td><td>${esc(a.equipamento)}</td><td>${esc(a.responsavel)}</td>
      <td class="fx ${isT?"hj":""}">${d?faltaTxt(d):""}</td></tr>`;}).join("");
    return `<div class="s-prog">${hero}<table class="t"><thead><tr><th style="width:150px">Data</th><th style="width:110px">Hora</th><th>Atividade</th><th style="width:260px">Equipamento</th><th style="width:300px">Responsável</th><th style="width:220px">Contagem</th></tr></thead><tbody>${rows}</tbody></table>
      ${it.length>max?`<div class="more">+ ${it.length-max} atividades programadas depois destas</div>`:""}</div>`;
  },
  comunicados(o){
    const all = list(o,"comunicados").filter(c=>c.titulo && noAr(c));
    if(!all.length) return emptyBox("Nenhum comunicado no ar","Cadastre os comunicados no editor.");
    const it = all.filter(c=>c.nivel==="Importante").concat(all.filter(c=>c.nivel!=="Importante"));
    const [f,...r] = it, imp = f.nivel==="Importante";
    const quando = c => { const d=pDate(c.inicio); return d?fmtDMY(d):""; };
    return `<div class="s-com" style="${r.length?"":"grid-template-columns:1fr"}">
      <div class="card memo ${imp?"imp":""} ${f.foto?"has-img":""}">
        <div class="memo-t"><div class="memo-k"><span>${imp?"Comunicado importante":"Comunicado"}</span>${quando(f)?`<em class="num">${quando(f)}</em>`:""}</div>
          <h2>${esc(f.titulo)}</h2><p class="clamp3" style="-webkit-line-clamp:${f.foto?5:6}">${esc(f.mensagem)}</p>
          ${f.assinatura?`<div class="memo-s">${esc(f.assinatura)}</div>`:""}</div>
        ${f.foto?`<div class="memo-img">${img(f.foto)}</div>`:""}
      </div>
      ${r.length?`<div class="others">${r.slice(0,3).map(c=>`<div class="card oc memo-o ${c.nivel==="Importante"?"imp":""}"><div class="oc-txt"><span class="lbl">${c.nivel==="Importante"?"Importante":"Comunicado"}${quando(c)?" · "+quando(c):""}</span><b>${esc(c.titulo)}</b><p class="clamp2">${esc(c.mensagem)}</p></div></div>`).join("")}</div>`:""}
    </div>`;
  },
  treinamentos(o){
    const t = today0(), lim = new Date(+t + 7*864e5);
    const it = list(o,"treinamentos").filter(x=>{const d=pDate(x.data); return x.treinamento && d && d>=t && d<lim;})
      .sort((a,b)=>a.data.localeCompare(b.data)||(a.hora||"").localeCompare(b.hora||""));
    if(!it.length) return emptyBox("Sem treinamentos nos próximos 7 dias","Cadastre os treinamentos e os participantes no editor.");
    const names = x => String(x.participantes||"").split(/[\n,;]+/).map(n=>n.trim()).filter(Boolean);
    const show = it.slice(0,4), cols = show.length<=2?show.length:2;
    const tot = it.reduce((s,x)=>s+names(x).length,0);
    return `<div class="s-tr">
      <div class="tr-h"><b class="num">${it.length}</b><span>${it.length===1?"treinamento":"treinamentos"} nos próximos 7 dias · ${tot} ${tot===1?"participante":"participantes"}</span></div>
      <div class="tr-g" style="grid-template-columns:repeat(${cols},1fr)">${show.map(x=>{const d=pDate(x.data), isT=+d===+t, ns=names(x), mx=show.length>2?8:14;
        return `<div class="card tr ${isT?"today":""}">
          <div class="tr-d"><b class="num">${fmtDM(d)}</b><span>${isT?"hoje":wk(d)}</span></div>
          <div class="tr-b"><div class="tr-top">${x.tipo?`<span class="chip">${esc(x.tipo)}</span>`:""}<span class="tr-f">${esc(faltaTxt(d))}</span></div>
            <h3>${esc(x.treinamento)}</h3>
            <div class="tr-m">${[x.hora, x.local, x.instrutor?"Instrutor: "+x.instrutor:""].filter(Boolean).map(esc).join("  ·  ")}</div>
            ${ns.length?`<div class="tr-p">${ns.slice(0,mx).map(n=>`<span>${esc(n)}</span>`).join("")}${ns.length>mx?`<span class="more2">+${ns.length-mx}</span>`:""}</div>`:""}</div></div>`;}).join("")}</div>
      ${it.length>4?`<div class="more">+ ${it.length-4} treinamentos depois destes</div>`:""}</div>`;
  },
  dds(o){
    const t = +today0();
    const it = list(o,"dds").filter(x=>x.tema && pDate(x.data));
    let d = it.find(x=>+pDate(x.data)===t), hoje = !!d;
    if(!d){ const past = it.filter(x=>+pDate(x.data)<t).sort((a,b)=>b.data.localeCompare(a.data)); d = past[0]; }
    if(!d) return emptyBox("Sem DDS para hoje","Cadastre o tema do diálogo de segurança no editor.");
    const dt = pDate(d.data);
    const lbl = hoje ? `DDS de hoje · ${dt.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"})}` : `Último DDS realizado · ${fmtDMY(dt)}`;
    return `<div class="s-dds ${d.foto?"has-img":""}">
      <div class="dds-t"><div class="hazard h"></div><div class="lbl" style="color:var(--accent);font-size:22px">${esc(lbl)}</div>
        <h2>${esc(d.tema)}</h2>${d.mensagem?`<p class="clamp3" style="-webkit-line-clamp:5">${esc(d.mensagem)}</p>`:""}
        ${d.responsavel?`<div class="dds-r"><span class="lbl">Conduzido por</span><b>${esc(d.responsavel)}</b></div>`:""}</div>
      ${d.foto?`<div class="dds-img">${img(d.foto)}</div>`:""}</div>`;
  },
  escala(o){
    const h = get(o,"escala","horarios") || {};
    if(h.auto) return renderEscalaAuto(o);   // modo automático: técnicos de hoje/amanhã da plataforma
    const dias = list(o,"escala","dias").slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")).slice(0,7);
    const tur = list(o,"escala","turmas");

const orgCard = (p, side) => { const vaga = /^vaga/i.test(p.nome||"");
  const ini = String(p.nome||"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  return `<div class="on ${vaga?"vaga":""} ${side==="l"?"rev":""}"><div class="oa">${p.foto?img(p.foto):vaga?"":`<span>${esc(ini)}</span>`}</div><div class="ot"><b>${esc(p.nome)}</b><span>${esc(p.cargo)}</span></div></div>`; };
function orgCascata(it){
  const C = it.filter(p=>p.posicao==="Centro"), B = it.filter(p=>p.posicao==="Base");
  const S = it.filter(p=>p.posicao==="Esquerda"||p.posicao==="Direita");
  const rows = new Map(); let auto = Math.max(0, ...S.map(p=>num(p.fileira)));
  const pend = {Esquerda:[],Direita:[]};
  S.forEach(p=>{ const f=num(p.fileira); if(f>0){ if(!rows.has(f)) rows.set(f,{l:[],r:[]}); rows.get(f)[p.posicao==="Esquerda"?"l":"r"].push(p);} else pend[p.posicao].push(p); });
  while(pend.Esquerda.length||pend.Direita.length){ auto++; rows.set(auto,{l:pend.Esquerda.splice(0,1),r:pend.Direita.splice(0,1)}); }
  const ln = p => `<i class="ln ${p.ligacao==="Tracejada"?"dash":""}"></i>`;
  const side = [...rows.keys()].sort((a,b)=>a-b).map(k=>{const r=rows.get(k);
    return `<div class="cr"><div class="cl">${r.l.map(p=>orgCard(p,"l")+ln(p)).join("")}</div><div class="cc"></div><div class="cR">${r.r.map(p=>ln(p)+orgCard(p,"r")).join("")}</div></div>`;}).join("");
  const center = C.map(p=>`<div class="cr ctr"><div class="cl"></div><div class="cc"></div><div class="cR">${orgCard(p,"r")}</div></div>`).join("");
  const base = B.length ? `<div class="cb" style="--n:${B.length}">${B.map(p=>`<div class="cbi"><i class="drop ${p.ligacao==="Tracejada"?"dash":""}"></i>${orgCard(p,"r")}</div>`).join("")}</div>` : "";

}
R.organograma = function(o){
  const it = list(o,"organograma").filter(p=>p.nome);
  if(!it.length) return emptyBox("Organograma vazio","Cadastre as pessoas e a quem cada uma responde no editor.");
  if(it.some(p=>p.posicao)) return orgCascata(it);
  const names = new Set(it.map(p=>p.nome));
  const kids = {}; it.forEach(p=>{ const s=p.superior; if(s && s!==p.nome && names.has(s)) (kids[s]=kids[s]||[]).push(p); });
  const roots = it.filter(p=>!p.superior || p.superior===p.nome || !names.has(p.superior));
  const ini = n => String(n||"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const seen = new Set();
  const node = (p,lvl) => { if(seen.has(p.nome)||lvl>6) return ""; seen.add(p.nome);
    const ch = (kids[p.nome]||[]).map(c=>node(c,lvl+1)).join("");
    const nk = (kids[p.nome]||[]).length, vaga = /^vaga/i.test(p.nome||"");

  return `<div class="org"><ul class="tree">${(roots.length?roots:[it[0]]).map(r=>node(r,0)).join("")}</ul></div>`;
};

    main.innerHTML = state==="nodb"

/* Rascunho à prova de quedas: cada edição é gravada no navegador (localStorage).
   Se a página fechar, travar ou cair a luz, o que foi digitado volta ao reabrir.
   O rascunho só sai do navegador quando o conteúdo é salvo no banco. */
const DRAFT_KEY = "zamine-tv-draft-" + PANEL_SLUG + "-v1";
const baseEm = {};               // baseEm[aba] = data de publicação que este editor carregou

let draftSaveT = null;
function saveDraftLocal(){ if(!draft) return; clearTimeout(draftSaveT); draftSaveT = setTimeout(()=>{
  try{
    const bySec = {}, be = {};
    dirtySecs.forEach(k=>{ if(draft && draft[k]) bySec[k] = draft[k]; if(baseEm[k]) be[k] = baseEm[k]; });
    if(!Object.keys(bySec).length){ localStorage.removeItem(DRAFT_KEY); return; }
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ts:Date.now(), bySec, baseEm:be}));
  }catch(e){ /* cota cheia etc: rascunho é best-effort, o banco continua sendo a fonte */ }
},300); }
function loadDraftLocal(){ try{ const raw = localStorage.getItem(DRAFT_KEY); if(!raw) return null; const p = JSON.parse(raw); return (p && p.bySec && typeof p.bySec === "object") ? p : null; }catch(e){ return null; } }
function clearDraftLocal(keys){ try{ const p = loadDraftLocal(); if(!p) return; (keys || Object.keys(p.bySec)).forEach(k=>{ delete p.bySec[k]; delete (p.baseEm||{})[k]; }); if(Object.keys(p.bySec).length) localStorage.setItem(DRAFT_KEY, JSON.stringify(p)); else localStorage.removeItem(DRAFT_KEY); }catch(e){} }

  focusOnly = !!only;
  if(!editable().some(s=>s.key===curSec)) curSec = editable()[0].key;
  if(dirty && draft){ $("editor").hidden=false; $("edSave").hidden=false; $("edPrev").hidden=false; $("edDiscard").hidden=false; renderNav(); renderSec(); return; }
  draft = clone(data);
  if(!draft.config) draft.config = {};
  if(!draft.config.ativos) draft.config.ativos = Object.fromEntries(SLIDE_KEYS.map(k=>[k,true]));
  /* recuperação de rascunho salvo no navegador (queda de luz, F5, fechamento acidental) */
  const salvos = loadDraftLocal();
  const recuperados = [];
  if(salvos){
    Object.keys(salvos.bySec).forEach(k=>{
      const sec = SECTIONS.find(x=>x.key===k);
      if(!sec || !salvos.bySec[k] || typeof salvos.bySec[k] !== "object") return;
      if(!(canEdit || minhasPermissoes.includes(k))) return;
      draft[k] = salvos.bySec[k];
      if(salvos.baseEm && salvos.baseEm[k]) baseEm[k] = salvos.baseEm[k];
      restoredKeys.add(k);
      dirtySecs.add(k);
      recuperados.push(sec.label);
    });
  }
  if(recuperados.length){
    dirtySecs.add(curSec); setDirty(true);
    $("edDiscard").hidden = false;
    toast("Rascunho recuperado de " + fmtWhen(salvos.ts) + " (" + recuperados.join(", ") + "). Revise e salve — ou use Descartar rascunho.");
  } else {
    setDirty(false);
    $("edDiscard").hidden = true;
  }
  $("editor").hidden = false;
  $("edSave").hidden = false; $("edPrev").hidden = false;
  renderNav(); renderSec();
  refreshPend().then(()=>renderNav());
  if(canEdit){
    Promise.all([api(`/api/tv/${PANEL_SLUG}/permissoes`,{headers:authHeaders()}), api("/api/users",{headers:authHeaders()})])
      .then(([p,u])=>{ permCache = p.permissoes||[]; usersCache = (u.users||[]).filter(x=>x.isActive!==false); if(curSec==="permissoes") renderSec(); })
      .catch(()=>{});
  }
}

/* fotos em lote: casa o nome do arquivo com a pessoa pelo nome (imune a acentos/maiúsculas) */
function normNome(v){ return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
function casarFotoNome(base, itens){
  const q = normNome(base);
  if(!q) return {idx:-1, motivo:"sem"};
  let hits = itens.map((it,i)=>({it,i})).filter(x=>normNome(x.it.nome)===q);          // 1) nome completo igual
  if(hits.length===1) return {idx:hits[0].i};
  if(hits.length>1) return {idx:-1, motivo:"amb", alvos:hits.map(h=>h.it.nome)};
  hits = itens.map((it,i)=>({it,i})).filter(x=>{const n=normNome(x.it.nome); return n===q||n.startsWith(q+" ");});  // 2) arquivo é começo do nome
  if(hits.length===1) return {idx:hits[0].i};
  if(hits.length>1) return {idx:-1, motivo:"amb", alvos:hits.map(h=>h.it.nome)};
  hits = itens.map((it,i)=>({it,i})).filter(x=>{const n=normNome(x.it.nome); return n.length>3 && (q+" ").startsWith(n+" ");});  // 3) nome é começo do arquivo
  if(hits.length===1) return {idx:hits[0].i};
  if(hits.length>1) return {idx:-1, motivo:"amb", alvos:hits.map(h=>h.it.nome)};
  return {idx:-1, motivo:"sem"};
}

}

/* cópia de segurança */
function wireBackup(){
  const d = $("bkDown"), f = $("bkFile"); if(!d) return;
  d.onclick = async ()=>{
    const pack = {app:"painel-tv-zamine", versao:1, geradoEm:new Date().toISOString(), secoes:secData, config:cfgData||{}};
    try{
      const blobFile = new Blob([JSON.stringify(pack,null,2)],{type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blobFile);
      a.download = `painel-zamine-copia-${iso(new Date())}.json`; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      toast("Cópia de segurança baixada.");
    }catch(e){ toast("Não foi possível baixar a cópia. Tente de novo."); }
  };
  f.addEventListener("change", async ()=>{
    const file = f.files && f.files[0]; if(!file) return;
    let pack; try{ pack = JSON.parse(await file.text()); }catch(e){ toast("Esse arquivo não é uma cópia do painel."); return; }
    if(!pack || pack.app!=="painel-tv-zamine" || typeof pack.secoes!=="object"){ toast("Esse arquivo não é uma cópia do painel."); return; }
    const keys = Object.keys(pack.secoes).filter(k=>SECTIONS.some(x=>x.key===k && x.key!=="config"));
    const quando = pack.geradoEm ? new Date(pack.geradoEm).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "data desconhecida";
    $("bkAsk").innerHTML = `<div class="bk-confirm"><p>Isso troca o conteúdo atual de <b>${keys.length} telas</b> e das configurações pelo da cópia de <b>${esc(quando)}</b>. O que foi feito depois dessa data será perdido.</p>
      <button type="button" class="btn" id="bkNo">Cancelar</button><button type="button" class="btn pri" id="bkYes">Restaurar agora</button></div>`;
    $("bkNo").onclick = ()=>{ $("bkAsk").innerHTML=""; f.value=""; };
    $("bkYes").onclick = async ()=>{
      const b=$("bkYes"); b.disabled=true; b.textContent="Restaurando…"; let fail=0;
      for(const k of keys){ try{ await api(`/api/tv/${PANEL_SLUG}/secoes/${k}`,{method:"PUT",headers:authHeaders(),body:JSON.stringify(stripMeta(pack.secoes[k]))}); }catch(e){ fail++; } }
      if(pack.config && typeof pack.config==="object"){ try{ await api(`/api/tv/${PANEL_SLUG}/config`,{method:"PUT",headers:authHeaders(),body:JSON.stringify(stripMeta(pack.config))}); }catch(e){ fail++; } }
      $("bkAsk").innerHTML=""; f.value="";
      if(fail){ toast(`Restaurado com ${fail} falha(s). Tente de novo.`); } else { toast("Cópia restaurada. A TV já mostra o conteúdo da cópia."); clearDraftLocal(); }
      Object.keys(metaCache).forEach(k=>delete metaCache[k]);
      await refreshPend();
      draft = clone(data); setDirty(false); renderNav(); renderSec(); refreshContent();
    };
  });
}

    secData = j.secoes||{}; cfgData = j.config||{}; escalaAuto = j.escalaAuto||null;
    gotSec = true; gotCfg = true;
    onData();
  }catch(e){}
}
function aprovHtml(){
  if(!pendCache.length) return `<div class="pcard"><p class="hint" style="margin:0">Nenhuma alteração pendente. Tudo que está na TV foi aprovado.</p></div>`;
  return `<div class="pcard">` + pendCache.map(p=>`<div class="pend">
    <div class="pi"><b>${esc(TITLES[p.sectionKey]||p.sectionKey)}</b><span>Enviado por ${esc(p.porNome||"?")} em ${fmtWhen(p.em)} — aguardando sua aprovação para entrar na TV</span></div>
    <div class="pb"><button type="button" class="btn pri" data-ap="${esc(p.sectionKey)}">Aprovar e ir para a TV</button><button type="button" class="btn del" data-rj="${esc(p.sectionKey)}">Rejeitar</button></div>
    <div class="pv2"><div class="pv2-bar"><b>Prévia do que entraria na TV</b></div><div class="pv2-in" data-pv="${esc(p.sectionKey)}"></div></div>
  </div>`).join("") + `</div>`;
}
function wireAprov(){
  const m=$("edMain");
  m.querySelectorAll("[data-pv]").forEach(box=>{
    const p=pendCache.find(x=>x.sectionKey===box.dataset.pv); if(!p) return;
    let html; try{ html=R[p.sectionKey]({...p.data}); }catch(e){ html=emptyBox("Erro na prévia",""); }
    box.innerHTML=`<div class="pv2-stage"><div class="slide" style="animation:none">${html}</div></div>`;
    const st=box.querySelector(".pv2-stage"); if(st){ const sc=box.clientWidth/1920; st.style.transform=`scale(${sc})`; }
  });
  const act=async(key,acao)=>{
    try{
      await api(`/api/tv/${PANEL_SLUG}/secoes/${key}/aprovacao`,{method:"POST",headers:authHeaders(),body:JSON.stringify({acao})});
      toast(acao==="aprovar"?"Aprovado! A TV já mostra a alteração.":"Alteração rejeitada. A TV continua com o conteúdo anterior.");
      await refreshPend(); delete metaCache[key]; delete baseEm[key]; renderNav(); renderSec(); refreshContent();
    }catch(e){ toast(e.message||"Falha na aprovação."); }
  };
  m.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>act(b.dataset.ap,"aprovar"));
  m.querySelectorAll("[data-rj]").forEach(b=>b.onclick=()=>act(b.dataset.rj,"rejeitar"));
}
function permHtml(){
  const opts = usersCache.map(u=>`<option value="${esc(u.email)}" data-n="${esc(u.name||"")}">${esc(u.name||u.email)} — ${esc(u.email)}</option>`).join("");
  const checks = SECTIONS.filter(s=>!s.admin).map(s=>`<label class="psec"><input type="checkbox" value="${s.key}"> ${esc(s.label)}</label>`).join("");
  const agrup = {};
  permCache.forEach(p=>{ (agrup[p.userEmail]=agrup[p.userEmail]||{nome:p.userName,abas:[]}).abas.push(p.sectionKey); });
  const lista = Object.keys(agrup).length
    ? Object.entries(agrup).sort((a,b)=>a[0].localeCompare(b[0])).map(([em,g])=>`<div class="perm-item"><b>${esc(g.nome||em)}</b><span class="tags">${g.abas.map(k=>`<span class="tagx">${esc(TITLES[k]||k)}</span>`).join("")}</span><button type="button" class="btn del" data-rmuser="${esc(em)}">Remover tudo</button></div>`).join("")
    : `<p class="hint" style="margin:0">Nenhum editor liberado ainda — só administradores podem editar o painel.</p>`;
  return `<div class="perm-u">
    <div class="perm-row">
      <div class="pu"><b>Liberar edição por aba</b></div>
      <div class="fld" style="max-width:480px"><label>Usuário da plataforma</label>
        <select id="permUser"><option value="">Selecione o usuário…</option>${opts}</select></div>
      <div class="psecs" id="permSecs">${checks}</div>
      <div style="display:flex;gap:10px"><button type="button" class="btn pri" id="permSave">Salvar permissões deste usuário</button></div>
    </div>
    <div class="perm-list">${lista}</div>
  </div>`;
}
function wirePerm(){
  const m=$("edMain");
  const sel=document.getElementById("permUser");
  if(sel) sel.onchange=()=>{
    const em=sel.value; const abas=new Set(permCache.filter(p=>p.userEmail===em).map(p=>p.sectionKey));
    m.querySelectorAll("#permSecs input").forEach(i=>{ i.checked=abas.has(i.value); });
  };
  const sv=document.getElementById("permSave");
  if(sv) sv.onclick=async()=>{
    if(!sel.value){ toast("Escolha um usuário."); return; }
    const abas=[...m.querySelectorAll("#permSecs input:checked")].map(i=>i.value);
    const opt=sel.selectedOptions[0]; const nome=(opt&&opt.getAttribute("data-n"))||"";
    sv.disabled=true;
    try{
      await api(`/api/tv/${PANEL_SLUG}/permissoes`,{method:"POST",headers:authHeaders(),body:JSON.stringify({userEmail:sel.value,userName:nome,sectionKeys:abas})});
      toast(abas.length?`Permissões salvas: ${abas.length} aba(s) para ${nome||sel.value}.`:`Todas as permissões de ${nome||sel.value} foram removidas.`);
      const p=await api(`/api/tv/${PANEL_SLUG}/permissoes`,{headers:authHeaders()}); permCache=p.permissoes||[];
      renderSec();
    }catch(e){ toast(e.message||"Não foi possível salvar as permissões."); }
    sv.disabled=false;
  };
  m.querySelectorAll("[data-rmuser]").forEach(b=>b.onclick=async()=>{
    const em=b.dataset.rmuser;
    if(!confirm(`Remover TODAS as permissões de ${em}?`)) return;
    try{
      await api(`/api/tv/${PANEL_SLUG}/permissoes?userEmail=${encodeURIComponent(em)}`,{method:"DELETE",headers:authHeaders()});
      const p=await api(`/api/tv/${PANEL_SLUG}/permissoes`,{headers:authHeaders()}); permCache=p.permissoes||[];
      renderSec(); toast("Permissões removidas.");
    }catch(e){ toast(e.message||"Falha ao remover."); }
  });
}
function setById(id, v){
  const p = id.split("-");
  if(p[0]==="f") draft[p[1]][p[2]][p[3]] = v; else draft[p[1]][p[2]][+p[3]][p[4]] = v;
}
async function shrink(file){
  if(!/^image\/(jpeg|png|webp|bmp)$/.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file);
    const max = 1600, sc = Math.min(1, max/Math.max(bmp.width,bmp.height));
    if(sc===1 && file.size < 900e3) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const out = await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
    return out || file;
  }catch(e){ return file; }
}
$("edClose").onclick=()=>{ $("editor").hidden=true; if(dirty) toast("Alterações não salvas foram mantidas no editor. Abra de novo para salvar."); };
$("edSave").onclick=async()=>{
  if(!canContrib) return;
  const keys = [...dirtySecs].filter(k=>canEdit || minhasPermissoes.includes(k));
  if(!keys.length){ toast("Nada para salvar."); return; }
  const b=$("edSave"); b.disabled=true; b.textContent="Salvando…";
  let failed = [], pend = [], conflicts = [];
  const put = (k, force)=>{
    const q=[]; if(baseEm[k]) q.push("baseEm="+encodeURIComponent(baseEm[k])); if(force) q.push("force=1");
    const url = k==="config" ? `/api/tv/${PANEL_SLUG}/config${q.length?"?"+q.join("&"):""}` : `/api/tv/${PANEL_SLUG}/secoes/${k}${q.length?"?"+q.join("&"):""}`;
    return api(url,{method:"PUT",headers:authHeaders(),body:JSON.stringify(stripMeta(draft[k]))});
  };
  const salva = async (k, force)=>{
    try{
      const r = await put(k, force);
      dirtySecs.delete(k); clearDraftLocal([k]); restoredKeys.delete(k);
      if(r.atualizadoEm) baseEm[k] = r.atualizadoEm;
      if(r.pending) pend.push(SECTIONS.find(x=>x.key===k)?.label||k);
    }catch(e){
      if(e && e.status===409) conflicts.push(k);
      else failed.push(SECTIONS.find(x=>x.key===k)?.label||k);
    }
  };
  for(const k of keys){ await salva(k,false); }
  if(conflicts.length){
    const nomes = conflicts.map(k=>SECTIONS.find(x=>x.key===k)?.label||k).join(", ");
    const sobrescrever = confirm("Outra pessoa publicou alterações em: "+nomes+", depois de você abrir o editor.\n\nSobrescrever com o seu conteúdo?\nCancelar mantém o seu texto no rascunho para você conferir antes.");
    if(sobrescrever){ for(const k of conflicts){ await salva(k,true); } }
    else { conflicts.forEach(k=>failed.push((SECTIONS.find(x=>x.key===k)?.label||k)+" — manteve seu rascunho")); }
  }
  b.disabled=false; b.textContent="Salvar e enviar para a TV";
  if(failed.length){ dirty = true; $("edSt").textContent="Alterações não salvas"; $("edSt").classList.add("dirty");
    toast("Não foi possível salvar: "+failed.join(", ")+"."); }
  else {
    setDirty(false);
    if(pend.length) toast("Enviado para aprovação: "+pend.join(", ")+". A TV atualiza depois de o administrador aprovar.");
    else toast("Salvo. A TV já mostra as novas informações.");
    await refreshPend(); renderNav(); refreshContent();
  }
};
$("edDiscard").onclick=()=>{
  if(!confirm("Descartar o rascunho não salvo deste navegador? O conteúdo que está no ar permanece. Não dá para desfazer.")) return;
  clearDraftLocal(); restoredKeys.clear();
  dirtySecs.clear(); draft = clone(data);
  if(!draft.config) draft.config = {};
  if(!draft.config.ativos) draft.config.ativos = Object.fromEntries(SLIDE_KEYS.map(k=>[k,true]));
  dirty = false; $("edSt").textContent="Tudo salvo"; $("edSt").classList.remove("dirty"); $("edDiscard").hidden = true;
  renderNav(); renderSec(); toast("Rascunho descartado.");
};
$("bEdit").onclick=()=>openEditor();
addEventListener("beforeunload", e=>{ if(dirty){ e.preventDefault(); } });

/* ---------- conexão com o banco ---------- */
let failStreak = 0;   // falhas consecutivas de conexão (a TV se auto-recupera)
function onData(){
  if(!gotSec || !gotCfg) return;
  const wasReady = state==="ready";
  const has = Object.keys(secData).length || cfgData;
  data = has ? {...secData, config: cfgData || {}} : null;
  state = has ? "ready" : "empty";
  renderFrame(!wasReady);
  if(!wasReady && state==="ready") restartTimer();
  if(state!=="ready") clearTimeout(timer);
}
let linkHandled = false;
function maybeOpenFromLink(){
  if(linkHandled) return; linkHandled = true;
  const m = /^#editar-([A-Za-z]+)$/.exec(location.hash||"");
  if(!m) return;
  const sec = SECTIONS.find(x=>x.key===m[1]);
  if(!sec){ toast("Esse link de edição não existe mais. Peça um novo ao responsável pelo painel."); return; }
  if(!canEdit && !minhasPermissoes.includes(sec.key)){ toast("Você não tem permissão para editar esta aba. Peça acesso ao administrador do painel."); return; }
  if(!data) data = {config:{}};
  openEditor(sec.key, true);
}
/* ---------- conexão com a plataforma ---------- */
async function carregarConteudo(){
  try{
    const j = await api(`/api/tv/${PANEL_SLUG}/content?tz=${TV_TZ}`);
    failStreak = 0;
    secData = j.secoes||{}; cfgData = j.config||{}; escalaAuto = j.escalaAuto||null;
    gotSec = true; gotCfg = true;
    onData();
    return true;
  }catch(e){
    console.error(e);
    if(state!=="ready"){ state="nodb"; renderFrame(); }
    failStreak++;
    /* TV ligada por horas seguidas: se a conexão cair por muito tempo, recarrega a
       página sozinha para se recuperar de qualquer travamento — só quando não há
       edição em andamento, para nunca perder trabalho. */
    if(failStreak >= 20 && $("editor").hidden && !dirty){ location.reload(); }
    return false;
  }
}
let pollT = null;
function startPoll(){ clearInterval(pollT); pollT = setInterval(()=>{ if($("editor").hidden) carregarConteudo(); }, 30000); }
(async ()=>{
  // 1) Conteúdo da TV (leitura pública — somente o aprovado entra no ar)
  await carregarConteudo();
  startPoll();
  // 2) Login da plataforma define quem pode editar o quê
  try{
    const me = await api(`/api/tv/${PANEL_SLUG}/me`,{headers:authHeaders()});
    canEdit = !!me.isAdmin;
    minhasPermissoes = Array.isArray(me.permissoes)?me.permissoes:[];
    meuNome = (me.user && me.user.name) || "";
    meuEmail = (me.user && me.user.email) || "";
    canContrib = canEdit || minhasPermissoes.length>0;
  }catch(e){
    canEdit=false; canContrib=false; minhasPermissoes=[];
  }
  $("bEdit").hidden = false; // sempre visível: sem login abre a tela de entrada
  maybeOpenFromLink();
})();
</script>
